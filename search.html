<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - EmerTezora</title>
    <link rel="stylesheet" href="css/search.css">

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/search_data.js" defer></script>
    <script src="js/search.js" defer></script>
    <script src="js/learning_client.js" defer></script>
    <script src="js/gemini_client.js" defer></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        (function () {
            var consent = localStorage.getItem('cookieConsent');
            var status = (consent === 'accepted') ? 'granted' : 'denied';
            gtag('consent', 'default', {
                'ad_storage': status,
                'analytics_storage': status,
                'personalization_storage': status,
                'wait_for_update': 500
            });
        })();
    </script>
    <script src="js/cookie-consent.js" defer></script>
    <link rel="stylesheet" href="css/navbar.css">
    <script src="js/navbar.js" defer></script>
</head>

<body>
    <!-- Navbar will be injected by navbar.js -->

    <!-- Structure -->
    <header class="search-header">
        <h1 class="search-title">Search EmerTezora</h1>
    </header>

    <!-- Tabs -->
    <div class="search-tabs">
        <button class="search-tab active" id="tab-standard">Standard Search</button>
        <button class="search-tab" id="tab-ai">AI Context (Beta)</button>
        <button class="search-tab" id="tab-quantum">Quantum Learning</button>
    </div>

    <!-- Standard Search Container -->
    <div id="standard-search-view">
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Type to search topics...">
        </div>
        <div id="resultsContainer">
            <p style="opacity: 0.6;">Start typing to explore...</p>
        </div>
    </div>

    <!-- AI Search Container (Hidden by default) -->
    <div id="ai-search-view" style="display: none;">
        <div class="search-container">
            <input type="text" id="aiInput"
                placeholder="Ask questions about quantum mechanics within the project (e.g. 'What is superposition?')...">
        </div>
        <div id="aiResultsContainer" style="width: 100%; max-width: 800px; margin: 0 auto;">
            <!-- AI Results here -->
            <p style="opacity: 0.6;">Ask anything. The AI has learned from the project files.</p>
        </div>
        <div class="search-container"
            style="margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <p style="font-size: 0.9rem; opacity: 0.8;">Need general information? Ask Gemini directly:</p>
            <button id="askGeminiAiBtn" class="ingest-btn"
                style="background: #9b59b6; box-shadow: 0 0 10px #9b59b6;">Ask
                Gemini General</button>
        </div>
    </div>

    <!-- Quantum Learning View -->
    <div id="quantum-view" style="display: none;">

        <!-- URL + Question Inputs -->
        <div class="quantum-input-panel">
            <div class="quantum-input-group">
                <label for="quantumUrlInput" class="quantum-label">
                    <span class="quantum-label-icon">🔗</span> External Resource URL
                </label>
                <input type="url" id="quantumUrlInput"
                    placeholder="Paste a URL to study (e.g. https://en.wikipedia.org/wiki/Quantum_entanglement)"
                    class="quantum-url-input">
            </div>

            <div class="quantum-input-group">
                <label for="quantumInput" class="quantum-label">
                    <span class="quantum-label-icon">💬</span> Your Question
                </label>
                <input type="text" id="quantumInput"
                    placeholder="What would you like to know from this resource?"
                    class="quantum-question-input">
            </div>

            <button id="quantumAnalyzeBtn" class="quantum-analyze-btn">
                <span class="btn-icon">⚛️</span>
                Analyze &amp; Answer
            </button>
        </div>

        <div id="quantumResultsContainer" style="width: 100%; max-width: 800px; margin: 20px auto 0;">
            <p class="quantum-hint">🌐 Paste any external URL and ask a question — the AI will read and explain it for you.</p>
        </div>
    </div>

</body>

</html>
